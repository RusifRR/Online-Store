<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Online Store</title>
    <link rel="stylesheet" href="../statics/styles/register.css">
</head>
<body>
    <div class="split-screen">
        <!-- Левая часть с картинкой -->
        <div class="left-side">
            <img src="../statics/images/register/register-bg.jpg" alt="Регистрация" onerror="this.src='https://via.placeholder.com/800x1080?text=Картинка+для+Регистрации'">
        </div>

        <!-- Правая часть с формой -->
        <div class="right-side">
            <div class="form-container">
                <h2>Создать аккаунт</h2>
                <p class="subtitle">Присоединяйтесь к нам!</p>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="name">Ваше имя</label>
                        <input type="text" id="name" name="name" placeholder="Иван Иванов" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Придумайте пароль" required>
                    </div>

                    <button type="submit" class="submit-btn">Зарегистрироваться</button>
                </form>

                <p class="redirect-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
                <a href="index.html" class="back-home">← На главную</a>
            </div>
        </div>
    </div>
</body>
</html>
