<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="../statics/styles/login.css">
</head>
<body>
    <div class="split-screen">
        <div class="left-side">
            <img src="../statics/images/contact/headband.jpg" alt="Вход" onerror="this.src='https://via.placeholder.com/800x1080?text=Картинка+для+Входа'">
        </div>


        <div class="right-side">
            <div class="form-container">
                <h2>С возвращением!</h2>
                <p class="subtitle">Введите свои данные для входа</p>


                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="********" required>
                    </div>

                    <button type="submit" class="submit-btn">Войти</button>
                </form>
                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}
                <p class="redirect-link">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
                <a href="{{ url_for('home') }}" class="back-home">← На главную</a>
            </div>
        </div>
    </div>
</body>
</html>
